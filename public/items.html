<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/items.html">Items</a></li>
                <li><a href="/reviews.html">Reviews</a></li>
                <li><a href="/login.html" id="loginLink">Login</a>                       
                <button id="logoutButton" style="display: none;">Logout</button>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Items</h1>

            <section id="add-item" class="view hidden">
                <h2>Add Item</h2>
                <form id="addItemForm">
                    <label>Title<input name="title" maxlength="100" required></label>
                    <label>Description<textarea name="description" required></textarea></label>
                    <label>Price<input name="price" type="number" min="0.01" step="0.01" required></label>
                    <label>
                    Categories
                    <input name="categories" placeholder="electronics,gaming" required>
                    </label>
                    <small>Use lowercase words separated by commas.</small>
                    <button type="submit">Add Item</button>
                </form>
            </section>

            <section id="my-items" class="view hidden">
                <h2>My Items</h2>
                <div id="myItemsList" class="cards"></div>
            </section>

            <section id="search">
                <h2>Search by Category</h2>
                <form id="searchForm">
                    <label>Category<input name="category" placeholder="electronics" required></label>
                    <button type="submit">Search</button>
                </form>
                <div id="searchResults" class="cards"></div>
            </section>

            <section id="all-items" class="view">
                <h2>All Items</h2>
                <div id="allItemsList" class="cards"></div>
            </section>

            <template id="itemCardTemplate">
                <article class="card">
                    <h3 class="item-title"></h3>

                    <p class="item-description"></p>

                    <p>
                        <strong>Price:</strong>
                        <span class="item-price"></span>
                    </p>

                    <p>
                        <strong>Seller:</strong>
                        <span class="item-seller"></span>
                    </p>

                    <p>
                        <strong>Categories:</strong>
                        <span class="item-categories"></span>
                    </p>

                    <small class="item-date"></small>
                </article>
            </template>

    </main>


<script src="logout.js"></script>
<script src="items.js"></script>

</body>
</html>
