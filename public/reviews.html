<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reviews</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav>
        <ul>
            <li><a href="/index.html">Home</a></li>
            <li><a href="/items.html">Items</a></li>
            <li><a href="/reviews.html">Reviews</a></li>

            <li><a href="/login.html" id="loginLink">Login</a>
                <button id="logoutButton" style="display: none;">Logout
                </button>
            </li>
        </ul>
    </nav>
</header>

<main>

    <h1>Write a Review</h1>

    <p id="authMessage"></p>

    <section id="reviewSection">

        <form id="reviewForm">

            <label for="itemId">
                Item ID
            </label>

            <input
                id="itemId"
                name="itemId"
                type="number"
                min="1"
                required
            >

            <label for="rating">
                Rating
            </label>

            <select id="rating" name="rating" required>
                <option value="">Select a rating</option>
                <option value="Excellent">Excellent</option>
                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
                <option value="Poor">Poor</option>
            </select>

            <label for="comment">
                Comment
            </label>

            <textarea
                id="comment"
                name="comment"
                maxlength="500"
                required
            ></textarea>

            <button type="submit">
                Submit Review
            </button>

        </form>

        <p id="message"></p>

    </section>

</main>

<script src="logout.js"></script>
<script src="js/reviews.js"></script>

</body>
</html>
