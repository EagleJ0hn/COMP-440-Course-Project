<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comp 440 Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="/index.html">Home</a></li>
                <li><a href="/items.html">Items</a></li>
                <li><a href="/reviews.html">Reviews</a></li>
                <li><a href="/login.html" id="loginLink">Login</a>

                </li>
            </ul>
        </nav>
    </header>
<main>
    <h1>Welcome to our Comp 440 Project</h1>
    <p>Please log in to continue.</p>

    <section id="queries">
        <h2>SQL Queries</h2>

        <button id="query1Button">Query 1</button>
        <button id="query2Button">Query 2</button>
        <button id="query3Button">Query 3</button>

        <div id="query2Inputs" style="display: none;">
            <h3>Query 2</h3>

            <label for="categoryX">
                Category X:
            </label>
            <input
                id="categoryX"
                type="text"
                placeholder="electronics"
            >

            <label for="categoryY">
                Category Y:
            </label>
            <input
                id="categoryY"
                type="text"
                placeholder="gaming"
            >

        <button id="runQuery2Button">
            Run Query 2
        </button>
        </div>
    </section>

    <section id="queryResults">
        <h2>Query Results</h2>
        <div id="queryResultList"></div>
    </section>
</main>

<script src="logout.js"></script>
<script src="queries.js"></script>
